
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mausam Info Nepal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#0f172a,#1e293b,#2563eb,#0ea5e9);
    background-size:400% 400%;
    animation:gradient 12s ease infinite;
    color:#fff;
    padding:20px;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:100%;
    max-width:1000px;
}

.weather-app{
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:25px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
}

.logo h1{
    font-size:2rem;
}

.logo p{
    opacity:.8;
}

.clock{
    text-align:right;
}

.time{
    font-size:1.8rem;
    font-weight:600;
}

.search{
    margin:25px 0;
    display:flex;
    gap:12px;
}

.search input{
    flex:1;
    padding:15px;
    border:none;
    outline:none;
    border-radius:15px;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:16px;
}

.search input::placeholder{
    color:#ddd;
}

.search button{
    padding:15px 25px;
    border:none;
    border-radius:15px;
    background:#38bdf8;
    color:white;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

.search button:hover{
    transform:translateY(-2px);
}

.main{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.weather-main{
    text-align:center;
}

.weather-main img{
    width:130px;
}

.temperature{
    font-size:5rem;
    font-weight:700;
}

.city{
    font-size:2rem;
    margin-top:10px;
}

.description{
    text-transform:capitalize;
    opacity:.85;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:rgba(255,255,255,0.08);
    padding:20px;
    border-radius:18px;
    text-align:center;
}

.card h3{
    font-size:2rem;
}

.card p{
    opacity:.8;
}

.footer{
    margin-top:25px;
    text-align:center;
}

.loading{
    text-align:center;
    padding:20px;
    display:none;
}

.error{
    color:#ffb4b4;
    text-align:center;
    margin-top:10px;
}

.quick-cities{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

.quick-cities button{
    border:none;
    padding:10px 15px;
    border-radius:30px;
    background:rgba(255,255,255,0.12);
    color:white;
    cursor:pointer;
}

@media(max-width:768px){

.main{
    grid-template-columns:1fr;
}

.header{
    flex-direction:column;
    text-align:center;
}

.clock{
    text-align:center;
}

.temperature{
    font-size:4rem;
}

}
</style>
</head>

<body>

<div class="container">

<div class="weather-app">

<div class="header">

<div class="logo">
<h1>🌦 Mausam Info Nepal</h1>
</div>

<div class="clock">
<div class="time" id="time"></div>
<div id="date"></div>
</div>

</div>

<div class="search">
<input type="text" id="cityInput" placeholder="Search Nepal City">
<button onclick="getWeather()">Search</button>
</div>

<div class="quick-cities">
<button onclick="quickCity('Kathmandu')">Kathmandu</button>
<button onclick="quickCity('Pokhara')">Pokhara</button>
<button onclick="quickCity('Dharan')">Dharan</button>
<button onclick="quickCity('Biratnagar')">Biratnagar</button>
<button onclick="quickCity('Butwal')">Butwal</button>
</div>

<div class="loading" id="loading">
Loading weather data...
</div>

<div class="error" id="error"></div>

<div class="main">

<div class="weather-main">
<img id="icon">
<div class="temperature" id="temp">--°</div>
<div class="city" id="city">Kathmandu</div>
<div class="description" id="desc">Weather Description</div>
</div>

<div class="stats">

<div class="card">
<h3 id="feels">--</h3>
<p>Feels Like</p>
</div>

<div class="card">
<h3 id="humidity">--</h3>
<p>Humidity</p>
</div>

<div class="card">
<h3 id="wind">--</h3>
<p>Wind Speed</p>
</div>

<div class="card">
<h3 id="pressure">--</h3>
<p>Pressure</p>
</div>

</div>

</div>

<div class="footer">
Powered by OpenWeather API
</div>

</div>

</div>

<script>

const API_KEY = "fa6b49cba5a0d22bdc435a0dfa36dd61";

function updateClock(){

const now = new Date();

document.getElementById('time').innerText =
now.toLocaleTimeString();

document.getElementById('date').innerText =
now.toDateString();

}

setInterval(updateClock,1000);
updateClock();

function quickCity(city){

document.getElementById("cityInput").value = city;
getWeather();

}

async function getWeather(cityName=null){

const city =
cityName ||
document.getElementById("cityInput").value ||
"Kathmandu";

document.getElementById("loading").style.display="block";
document.getElementById("error").innerText="";

try{

const response = await fetch(
`https://api.openweathermap.org/data/2.5/weather?q=${city},NP&units=metric&appid=${API_KEY}`
);

const data = await response.json();

if(data.cod != 200){
throw new Error(data.message);
}

document.getElementById("temp").innerHTML =
Math.round(data.main.temp) + "°";

document.getElementById("city").innerHTML =
data.name + ", Nepal";

document.getElementById("desc").innerHTML =
data.weather[0].description;

document.getElementById("feels").innerHTML =
Math.round(data.main.feels_like) + "°C";

document.getElementById("humidity").innerHTML =
data.main.humidity + "%";

document.getElementById("wind").innerHTML =
data.wind.speed + " m/s";

document.getElementById("pressure").innerHTML =
data.main.pressure + " hPa";

document.getElementById("icon").src =
`https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png`;

}
catch(err){

document.getElementById("error").innerText =
"City not found. Please try again.";

}
finally{

document.getElementById("loading").style.display="none";

}

}

getWeather("Kathmandu");

document.getElementById("cityInput")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){
getWeather();
}

});

</script>

</body>
</html>
